<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Happy Birthday Nhung ♥</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Dancing+Script:wght@500;700&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
  <style>
    :root {
      --bw: min(70vw, 860px);
      --bh: calc(var(--bw) * 0.40);
      --lh: calc(var(--bw) * 0.125);
      --bd: calc(var(--bw) * 0.13);
      --sd: calc(var(--bw) * 0.030);
      --parchment: #F5E6C8;
      --parchment-dk: #E8D5A3;
      --wood-dk: #3D1C02;
      --wood-mid: #6B3D1A;
      --wood-lt: #9C6B3A;
      --wax: #8B1A1A;
      --wax-hi: #C0392B;
      --gold: #C9A227;
      --gold-dk: #8B6914;
      --ink: #2C1A0A;
      --ink-lt: #5C3D1E;
    }
    @media (max-width: 560px) {
      :root { --bw: 92vw; }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #080200; width: 100vw; height: 100vh; overflow: hidden; font-family: 'IM Fell English SC', serif; -webkit-tap-highlight-color: transparent; }

    canvas#petals { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

    #audio-btn {
      position: fixed; top: 14px; right: 14px; z-index: 900;
      width: 44px; height: 44px; border-radius: 50%;
      border: 1px solid var(--gold-dk); background: rgba(30,10,2,.9);
      color: var(--gold); font-size: 1.15rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      touch-action: manipulation;
    }

    /* ── SCENE ── */
    #scene { position: relative; width: 100vw; height: 100vh; overflow: hidden; }

    .wall {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 30%, #220D04 0%, #0C0300 58%, #040100 100%);
    }
    .wall-glow {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 62%, rgba(255,145,40,.07) 0%, transparent 56%);
      animation: amb 5s ease-in-out infinite; pointer-events: none;
    }
    @keyframes amb { 0%,100%{opacity:1} 42%{opacity:.7} 74%{opacity:.92} }

    /* Table */
    #table {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 52%;
      background:
        repeating-linear-gradient(91deg, transparent 0, transparent 44px, rgba(255,165,45,.02) 44px, rgba(255,165,45,.02) 45px),
        linear-gradient(180deg, #1A0804 0%, #2C1108 22%, #3A1A0C 52%, #45210E 76%, #361407 100%);
      border-top: 3px solid #7C4A22;
      box-shadow: 0 -18px 45px rgba(0,0,0,.75) inset;
    }
    .tbl-rail { position: absolute; top: 3px; left: 0; width: 100%; height: 1px; background: linear-gradient(90deg, transparent, rgba(201,162,39,.24) 30%, rgba(201,162,39,.52) 50%, rgba(201,162,39,.24) 70%, transparent); }
    .tbl-edge { position: absolute; bottom: -9px; left: 0; width: 100%; height: 18px; background: linear-gradient(180deg, #160703, #070100); box-shadow: 0 10px 28px rgba(0,0,0,1); }

    /* Intro title */
    #intro-title {
      position: absolute; top: 6%; width: 100%; text-align: center;
      transition: opacity .8s ease; z-index: 20; pointer-events: none;
    }
    #intro-title.gone { opacity: 0; }
    .itag { font-family: 'Dancing Script', cursive; color: var(--gold); font-size: clamp(.85rem, 2vw, 1.2rem); letter-spacing: .12em; text-shadow: 0 0 20px var(--gold); opacity: .82; }
    .iname { font-family: 'Playfair Display', serif; font-size: clamp(1.3rem, 4.5vw, 2.6rem); color: var(--parchment-dk); margin-top: .35rem; text-shadow: 0 2px 26px rgba(245,230,200,.18); }

    /* ── BOX CONTAINER ── */
    #box-container {
      position: absolute;
      bottom: 26%;
      left: 50%; transform: translateX(-50%);
      z-index: 30;
      perspective: calc(var(--bw) * 1.7);
      perspective-origin: 50% -30%;
    }

    /* 3D tilt to show top face */
    #box-wrap {
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(16deg);
      transform-origin: center bottom;
      will-change: transform;
    }

    /* Table shadow (separate from box-wrap so it doesn't flatten 3D) */
    #box-shadow {
      position: absolute;
      bottom: calc(26% - 28px);
      left: 50%; transform: translateX(-50%);
      width: calc(var(--bw) * 1.05);
      height: 60px;
      background: radial-gradient(ellipse at 50% 0%, rgba(0,0,0,.85) 0%, transparent 65%);
      filter: blur(14px);
      z-index: 20; pointer-events: none;
    }

    /* ── LID ── */
    #lid-wrap {
      position: absolute;
      bottom: calc(100% - 2px); left: -2px;
      width: calc(var(--bw) + 4px);
      height: var(--lh);
      transform-style: preserve-3d;
      transform-origin: bottom center;
      transition: transform 1.6s cubic-bezier(0.22, 1.05, 0.36, 1.0);
      will-change: transform;
      z-index: 5;
    }
    #lid-wrap.open { transform: rotateX(-108deg); }

    /* Lid front face */
    .lid-top {
      position: absolute; inset: 0;
      background:
        repeating-linear-gradient(91deg, transparent 0, transparent 14px, rgba(255,255,255,.018) 14px, rgba(255,255,255,.018) 15px),
        linear-gradient(180deg, var(--wood-lt) 0%, var(--wood-mid) 100%);
      border: 2px solid var(--gold-dk); border-radius: 5px 5px 0 0;
      backface-visibility: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .lid-star { color: var(--gold); font-size: clamp(1rem, 2.5vw, 1.55rem); text-shadow: 0 0 10px var(--gold), 0 0 25px rgba(201,162,39,.4); }

    /* Lid underside — shows when lid flips past 90° */
    .lid-under {
      position: absolute; inset: 0;
      background: linear-gradient(175deg, #2E1408 0%, #1A0804 50%, #0E0402 100%);
      border: 2px solid #4A2810; border-radius: 5px 5px 0 0;
      backface-visibility: hidden;
      transform: rotateX(180deg);
    }
    .lid-under::after {
      content: ''; position: absolute; inset: 0;
      background: repeating-linear-gradient(88deg, transparent 0, transparent 20px, rgba(80,30,5,.15) 20px, rgba(80,30,5,.15) 21px);
    }

    /* Lid TOP surface — horizontal face visible from above */
    .lid-roof {
      position: absolute; top: 0; left: 0; width: 100%; height: var(--bd);
      transform-origin: center top;
      transform: rotateX(-90deg);
      background:
        repeating-linear-gradient(91deg, transparent 0, transparent 12px, rgba(255,255,255,.02) 12px, rgba(255,255,255,.02) 13px),
        linear-gradient(0deg, var(--wood-mid) 0%, var(--wood-lt) 60%, #BF8B45 100%);
      border: 2px solid var(--gold-dk);
      box-shadow: inset 0 -4px 12px rgba(0,0,0,.3);
      backface-visibility: hidden;
    }
    /* Lid right side face */
    .lid-side-r {
      position: absolute; top: 0; right: 0;
      width: var(--bd); height: var(--lh);
      transform-origin: right center;
      transform: rotateY(-90deg);
      background: linear-gradient(90deg, var(--wood-mid) 0%, var(--wood-dk) 100%);
      border: 1px solid var(--gold-dk);
      backface-visibility: hidden;
    }
    /* Lid left side face */
    .lid-side-l {
      position: absolute; top: 0; left: 0;
      width: var(--bd); height: var(--lh);
      transform-origin: left center;
      transform: rotateY(90deg);
      background: linear-gradient(90deg, var(--wood-dk) 0%, var(--wood-mid) 100%);
      border: 1px solid var(--gold-dk);
      backface-visibility: hidden;
    }

    /* ── BOX BODY ── */
    #box-body {
      width: var(--bw);
      height: var(--bh);
      background:
        repeating-linear-gradient(92deg, transparent 0, transparent 14px, rgba(255,255,255,.016) 14px, rgba(255,255,255,.016) 15px),
        linear-gradient(155deg, var(--wood-lt) 0%, var(--wood-mid) 40%, var(--wood-dk) 100%);
      border: 2px solid var(--gold-dk);
      border-top: none;
      border-radius: 0 0 5px 5px;
      position: relative;
      overflow: hidden;
    }
    /* Metal corners */
    .bc { position: absolute; width: clamp(12px,1.8vw,20px); height: clamp(12px,1.8vw,20px); border: 2px solid var(--gold); z-index: 6; pointer-events: none; }
    .bc.tl { top:-1px; left:-1px; border-right:none; border-bottom:none; }
    .bc.tr { top:-1px; right:-1px; border-left:none; border-bottom:none; }
    .bc.bl { bottom:-1px; left:-1px; border-right:none; border-top:none; }
    .bc.br { bottom:-1px; right:-1px; border-left:none; border-top:none; }
    /* True 3D right side face */
    .box-side-r {
      position: absolute; top: 0; right: 0;
      width: var(--bd); height: var(--bh);
      transform-origin: right center;
      transform: rotateY(-90deg);
      background: linear-gradient(90deg, var(--wood-mid) 0%, var(--wood-dk) 100%);
      border-top: 2px solid var(--gold-dk);
      border-right: 1px solid rgba(139,105,20,.15);
      overflow: hidden;
    }
    .box-side-r::after {
      content: ''; position: absolute; inset: 0;
      background: repeating-linear-gradient(0deg, transparent 0, transparent 18px, rgba(0,0,0,.06) 18px, rgba(0,0,0,.06) 19px);
    }
    /* True 3D left side face */
    .box-side-l {
      position: absolute; top: 0; left: 0;
      width: var(--bd); height: var(--bh);
      transform-origin: left center;
      transform: rotateY(90deg);
      background: linear-gradient(90deg, var(--wood-dk) 0%, var(--wood-mid) 100%);
      border-top: 2px solid var(--gold-dk);
    }
    /* Box top rim — horizontal wooden edge visible when lid is open */
    .box-top-rim {
      position: absolute; top: 0; left: 0;
      width: 100%; height: var(--bd);
      transform-origin: center top;
      transform: rotateX(-90deg);
      background: linear-gradient(180deg, #C08840 0%, var(--wood-lt) 45%, var(--wood-mid) 100%);
      border: 2px solid var(--gold-dk);
      border-bottom: none;
    }

    /* Horizontal wood panel lines on body */
    .box-body-line { position: absolute; left: 0; right: 0; height: 1px; background: rgba(0,0,0,.2); z-index: 2; pointer-events: none; }

    /* ── LABEL (closed) ── */
    #box-label {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 4; transition: opacity .45s ease;
    }
    .bl-inner {
      background: var(--parchment); border: 1.5px solid var(--gold-dk);
      padding: clamp(10px,2vw,16px) clamp(14px,3vw,24px);
      text-align: center; box-shadow: 0 2px 14px rgba(0,0,0,.55);
      max-width: 72%;
    }
    .bl-to { font-size: clamp(.52rem,1.1vw,.65rem); color: var(--ink-lt); letter-spacing: .13em; }
    .bl-name { font-family: 'Dancing Script', cursive; font-size: clamp(.92rem,2.4vw,1.25rem); font-weight: 700; color: var(--ink); margin-top: 4px; }

    /* ── INTERIOR (open) ── */
    #box-int {
      position: absolute; inset: 0;
      background: linear-gradient(170deg, #160704 0%, #0A0200 100%);
      z-index: 3; overflow: hidden;
      opacity: 0; pointer-events: none;
      transition: opacity .65s ease .5s;
    }
    #box-int::after {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(255,140,40,.09) 0%, transparent 62%);
      pointer-events: none; z-index: 0;
    }
    #box-int.show { opacity: 1; pointer-events: all; }

    /* ── MINI ENVELOPES ── */
    .me {
      position: absolute; cursor: pointer;
      transition: transform .26s cubic-bezier(.25,.46,.45,.94), opacity .32s ease;
    }
    .me-inner {
      width: 100%; height: 100%; position: relative;
      background: linear-gradient(155deg, #F0DCAA 0%, #D0AA62 100%);
      border-radius: 2px; border: 1px solid #9A7C1A;
      box-shadow: 0 2px 8px rgba(0,0,0,.65), 0 1px 2px rgba(0,0,0,.4);
      overflow: hidden;
    }
    .me-flap {
      position: absolute; top: 0; left: 0; right: 0; height: 44%;
      background: linear-gradient(165deg, #E0C87A 0%, #BEA04A 100%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }
    .me-seal {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      border-radius: 50%;
      background: radial-gradient(circle at 33% 33%, #CC4444 0%, var(--wax) 58%, #420808 100%);
      box-shadow: 0 1px 4px rgba(0,0,0,.5), 0 0 0 1.5px rgba(201,162,39,.24);
      z-index: 3;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Dancing Script', cursive; font-weight: 700;
      color: rgba(255,215,195,.9); pointer-events: none;
    }
    .me-num {
      position: absolute; bottom: 2px; right: 3px;
      color: rgba(90,50,5,.42); pointer-events: none; z-index: 4;
    }

    /* ── COUNTER & OPEN BTN ── */
    #box-counter {
      position: absolute;
      top: calc(100% + var(--sd) + 18px);
      left: 50%; transform: translateX(-50%);
      font-size: clamp(.64rem,1.4vw,.76rem); color: var(--gold);
      border: 1px solid var(--gold-dk); padding: 3px 16px; border-radius: 20px;
      opacity: .68; white-space: nowrap; letter-spacing: .06em;
    }

    #open-btn {
      position: absolute;
      top: calc(100% + var(--sd) + 58px);
      left: 50%; transform: translateX(-50%);
      font-family: 'Playfair Display', serif;
      font-size: clamp(.78rem,1.8vw,.95rem); letter-spacing: .17em; text-transform: uppercase;
      color: var(--ink);
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dk) 100%);
      border: none; padding: clamp(10px,2.2vw,13px) clamp(22px,4vw,36px);
      border-radius: 2px; cursor: pointer; white-space: nowrap;
      box-shadow: 0 4px 20px rgba(201,162,39,.44), inset 0 1px 0 rgba(255,255,255,.28);
      transition: transform .25s, box-shadow .25s, opacity .45s ease;
      overflow: hidden; touch-action: manipulation;
    }
    #open-btn::after {
      content: ''; position: absolute; top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.26), transparent);
      transition: left .5s;
    }
    #open-btn:hover::after { left: 110%; }
    #open-btn:hover { transform: translateX(-50%) translateY(-2px); box-shadow: 0 8px 28px rgba(201,162,39,.65); }
    #open-btn.gone { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(10px); }

    /* ── READ PILE ── */
    #read-pile {
      position: absolute;
      bottom: 24%;
      left: calc(50% + var(--bw) / 2 + var(--sd) + 32px);
      z-index: 30; display: none;
    }
    @media (max-width: 700px) {
      #read-pile {
        left: 50%; transform: translateX(-50%);
        bottom: calc(24% - 90px);
      }
    }
    .pile-lbl { font-size: clamp(.58rem,1.2vw,.7rem); color: var(--gold); opacity: .5; letter-spacing: .08em; margin-bottom: 8px; white-space: nowrap; }
    #pile-stack { position: relative; width: clamp(80px,9vw,115px); height: 65px; }
    .pc {
      position: absolute; bottom: 0; left: 0;
      width: 88%; height: 56px;
      background: linear-gradient(155deg, #F0DCAA 0%, #C8A055 100%);
      border: 1px solid #9A7818; border-radius: 2px;
      box-shadow: 0 2px 8px rgba(0,0,0,.55);
      opacity: 0;
      transition: transform .6s cubic-bezier(.34,1.3,.64,1), opacity .4s ease;
    }
    .pc::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 42%;
      background: linear-gradient(165deg, #E0C878, #BEA048);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    /* ── FLYING ENV ── */
    #fly-env { position: fixed; pointer-events: none; z-index: 700; opacity: 0; }
    .fly-inner {
      width: 100%; height: 100%; position: relative;
      background: linear-gradient(155deg, #F0DCAA 0%, #D0AA62 100%);
      border-radius: 2px; border: 1px solid #9A7C1A; overflow: hidden;
    }
    .fly-flap {
      position: absolute; top: 0; left: 0; right: 0; height: 44%;
      background: linear-gradient(165deg, #E0C87A, #BEA04A);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }
    .fly-seal {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      border-radius: 50%;
      background: radial-gradient(circle at 33% 33%, #CC4444, var(--wax) 58%, #420808 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Dancing Script', cursive; font-weight: 700;
      color: rgba(255,215,195,.9);
    }

    /* ── MODAL ── */
    #modal {
      position: fixed; inset: 0; z-index: 800;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity .35s ease;
    }
    #modal.active { opacity: 1; pointer-events: all; }
    .m-bg { position: absolute; inset: 0; background: rgba(4,1,0,.94); cursor: pointer; }
    .m-box {
      position: relative; z-index: 2;
      width: min(90vw, 640px); max-height: 90vh;
      overflow-y: auto; scrollbar-width: none;
      transform: scale(.87) translateY(24px);
      transition: transform .5s cubic-bezier(.34,1.56,.64,1);
    }
    #modal.active .m-box { transform: scale(1) translateY(0); }
    .m-inner {
      background: var(--parchment); padding: clamp(14px,3vw,22px); border-radius: 3px;
      box-shadow: 0 0 0 3px var(--gold-dk), 0 0 0 6px rgba(201,162,39,.14), 0 26px 65px rgba(0,0,0,.94);
      position: relative; overflow: hidden;
    }
    .m-inner::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 15% 15%, rgba(201,162,39,.055) 0%, transparent 62%);
      pointer-events: none;
    }
    .m-close {
      position: absolute; top: 9px; right: 9px;
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--wax); color: var(--parchment);
      border: none; font-size: .82rem; cursor: pointer; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      touch-action: manipulation;
      transition: background .2s, transform .2s;
    }
    .m-close:hover { background: var(--wax-hi); transform: scale(1.12); }
    .m-frame { margin: 0 auto 14px; }
    .m-frame-b {
      padding: clamp(5px,1.2vw,9px);
      background: linear-gradient(145deg, var(--wood-dk) 0%, var(--wood-mid) 50%, var(--wood-dk) 100%);
      box-shadow: inset 0 0 8px rgba(0,0,0,.45), 0 4px 20px rgba(0,0,0,.42); border-radius: 3px;
    }
    .m-frame-m { padding: 5px; background: #F8F3E8; box-shadow: inset 0 0 5px rgba(0,0,0,.15); }
    .m-img { width: 100%; max-height: 50vh; object-fit: contain; display: block; }
    .m-orn { text-align: center; color: var(--gold-dk); font-size: 1.05rem; letter-spacing: .34em; margin: 10px 0 7px; }
    .m-lnum { text-align: center; font-size: .62rem; color: var(--ink-lt); opacity: .4; letter-spacing: .14em; margin-bottom: 7px; }
    .m-msg { font-family: 'Dancing Script', cursive; font-size: clamp(.95rem,3vw,1.22rem); color: var(--ink); text-align: center; line-height: 1.65; padding: 0 .3rem; }
    .m-sig { font-family: 'Dancing Script', cursive; font-size: .96rem; color: var(--wax); text-align: right; margin-top: 7px; padding-right: .3rem; }
    .m-date { font-size: .64rem; color: var(--ink-lt); text-align: center; margin-top: 5px; letter-spacing: .1em; opacity: .5; }
    .m-nav { display: flex; align-items: center; justify-content: center; gap: 1.2rem; margin-top: 13px; }
    .nb { width: 44px; height: 44px; border-radius: 50%; background: var(--wax); color: var(--parchment); border: none; font-size: 1rem; cursor: pointer; touch-action: manipulation; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(0,0,0,.4); transition: background .2s, transform .2s; }
    .nb:hover { background: var(--wax-hi); transform: scale(1.1); }
    .nc { font-size: .75rem; color: var(--ink-lt); min-width: 52px; text-align: center; letter-spacing: .04em; }
  </style>
</head>
<body>

<canvas id="petals"></canvas>
<button id="audio-btn">♪</button>

<div id="scene">
  <div class="wall"></div>
  <div class="wall-glow"></div>

  <div id="table">
    <div class="tbl-rail"></div>
    <div class="tbl-edge"></div>
  </div>
  <div id="box-shadow"></div>

  <div id="intro-title">
    <p class="itag">✦ &nbsp; Một món quà từ trái tim &nbsp; ✦</p>
    <h1 class="iname">Happy Birthday, Nhung</h1>
  </div>

  <div id="box-container">
    <div id="box-wrap">
      <div id="lid-wrap">
        <div class="lid-top"><span class="lid-star">✦</span></div>
        <div class="lid-under"></div>
        <div class="lid-roof"></div>
        <div class="lid-side-r"></div>
        <div class="lid-side-l"></div>
      </div>
      <div id="box-body">
        <span class="bc tl"></span><span class="bc tr"></span>
        <span class="bc bl"></span><span class="bc br"></span>
        <div class="box-body-line" style="top:33%"></div>
        <div class="box-body-line" style="top:66%"></div>
        <div id="box-label">
          <div class="bl-inner">
            <div class="bl-to">Gửi đến:</div>
            <div class="bl-name">Ngô Thị Hồng Nhung</div>
          </div>
        </div>
        <div id="box-int"></div>
      </div>
      <div class="box-side-r"></div>
      <div class="box-side-l"></div>
      <div class="box-top-rim"></div>
    </div>
    <div id="box-counter">34 lá thư chưa đọc</div>
    <button id="open-btn">✉&nbsp; Mở Hộp Thư</button>
  </div>

  <div id="read-pile">
    <div class="pile-lbl" id="pile-lbl">Đã đọc: 0 / 34</div>

// ── Seeded deterministic random ──
function sr(i,s){const v=Math.sin(i*127.1+s*311.7)*43758.5453;return v-Math.floor(v);}

// ── State ──
let openedSet=new Set(), current=0, pileCount=0, pendingClose=-1, isOpen=false;

// ── Audio ──
let actx=null, audioOn=false, aTimer=null;
const SCALE=[261.63,293.66,329.63,392,440,523.25,587.33,659.25];
const MEL=[0,2,4,7,4,2,5,7,3,5,7,5,4,2,0,2];
let mIdx=0;
function toggleAudio(){
  if(!actx) actx=new(window.AudioContext||window.webkitAudioContext)();
  if(actx.state==='suspended') actx.resume();
  audioOn=!audioOn;
  document.getElementById('audio-btn').textContent=audioOn?'♫':'♪';
  if(audioOn){playNote();aTimer=setInterval(playNote,730);}else clearInterval(aTimer);
}
function playNote(){
  if(!actx||!audioOn)return;
  const f=SCALE[MEL[mIdx%MEL.length]];mIdx++;
  const t=actx.currentTime;
  [[f,0.085],[f*2,0.032]].forEach(([freq,vol])=>{
    const o=actx.createOscillator(),g=actx.createGain();
    o.connect(g);g.connect(actx.destination);
    o.type='sine';o.frequency.value=freq;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+0.04);
    g.gain.exponentialRampToValueAtTime(0.0001,t+2.1);
    o.start(t);o.stop(t+2.3);
  });
}
// Box opening thud sound
function playOpenSound(){
  if(!actx)return;
  const n=actx.sampleRate*0.25;
  const buf=actx.createBuffer(1,n,actx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.5)*0.25;
  const src=actx.createBufferSource();src.buffer=buf;
  const g=actx.createGain(),f=actx.createBiquadFilter();
  f.type='lowpass';f.frequency.value=280;
  src.connect(f);f.connect(g);g.connect(actx.destination);
  g.gain.setValueAtTime(0.5,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.3);
  src.start();
}
document.getElementById('audio-btn').addEventListener('click',toggleAudio);

// ── Petals ──
const cvs=document.getElementById('petals'),ctx=cvs.getContext('2d');
let ptls=[];
const isMob=()=>innerWidth<=560;
function rsz(){cvs.width=innerWidth;cvs.height=innerHeight;}
rsz();window.addEventListener('resize',rsz);
function mkP(){return{x:Math.random()*innerWidth,y:-15,sz:5+Math.random()*9,vy:.5+Math.random()*1.4,vx:(Math.random()-.5)*1.3,rot:Math.random()*Math.PI*2,dr:(Math.random()-.5)*.055,op:.3+Math.random()*.44,col:Math.random()>.45?'#F0AAAA':'#F4CCAA',wb:Math.random()*Math.PI*2,wbs:.02+Math.random()*.03};}
function animP(){
  ctx.clearRect(0,0,cvs.width,cvs.height);
  const maxP=isMob()?30:70;
  if(Math.random()<(isMob()?.07:.13)&&ptls.length<maxP)ptls.push(mkP());
  ptls=ptls.filter(p=>p.y<cvs.height+20);
  ptls.forEach(p=>{
    p.y+=p.vy;p.wb+=p.wbs;p.x+=p.vx+Math.sin(p.wb)*.7;p.rot+=p.dr;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    ctx.globalAlpha=p.op;ctx.fillStyle=p.col;
    ctx.beginPath();ctx.ellipse(0,0,p.sz*.44,p.sz,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
  requestAnimationFrame(animP);
}
animP();

// ── Build interior envelopes ──
function buildInterior(){
  const intEl=document.getElementById('box-int');
  intEl.innerHTML='';
  const iw=intEl.clientWidth, ih=intEl.clientHeight;
  const ew=Math.max(52,Math.min(iw*0.148,106));
  const eh=ew*0.618;
  const sealSz=ew*0.224;
  const numSz=Math.max(7,ew*0.1);

  DATA.forEach((_,i)=>{
    if(openedSet.has(i))return;
    const maxX=Math.max(0,iw-ew-8);
    const maxY=Math.max(0,ih-eh-8);
    const x=4+sr(i,0)*maxX, y=4+sr(i,1)*maxY;
    const r=(sr(i,2)-.5)*56;
    const z=(i%9)+1;
    const el=document.createElement('div');
    el.className='me';el.id=`me${i}`;
    el.style.cssText=`left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;width:${ew.toFixed(1)}px;height:${eh.toFixed(1)}px;z-index:${z};transform:rotate(${r.toFixed(1)}deg);opacity:0;`;
    el.innerHTML=`<div class="me-inner"><div class="me-flap"></div><div class="me-seal" style="width:${sealSz}px;height:${sealSz}px;font-size:${sealSz*.38}px">P♥N</div><span class="me-num" style="font-size:${numSz}px">${String(i+1).padStart(2,'0')}</span></div>`;

    // Mouse hover (desktop)
    el.addEventListener('mouseenter',()=>{el.style.transform=`rotate(${r.toFixed(1)}deg) translateY(-${ew*.18}px) scale(1.2)`;el.style.zIndex=50;el.style.filter='brightness(1.12)';});
    el.addEventListener('mouseleave',()=>{el.style.transform=`rotate(${r.toFixed(1)}deg)`;el.style.zIndex=z;el.style.filter='';});
    // Click / touch
    el.addEventListener('click',()=>clickEnv(i,el));
    intEl.appendChild(el);
  });

  // Staggered fade-in
  requestAnimationFrame(()=>{
    intEl.querySelectorAll('.me').forEach((e,idx)=>{
      setTimeout(()=>{e.style.opacity='1';},55+idx*40);
    });
  });
}

// ── Box open ──
document.getElementById('open-btn').addEventListener('click',()=>{
  if(isOpen)return;
  isOpen=true;
  // Init audio context on first interaction
  if(!actx){actx=new(window.AudioContext||window.webkitAudioContext)();}

  document.getElementById('lid-wrap').classList.add('open');
  document.getElementById('open-btn').classList.add('gone');
  document.getElementById('intro-title').classList.add('gone');

  // Fade label
  setTimeout(()=>{
    const lbl=document.getElementById('box-label');
    lbl.style.opacity='0';lbl.style.pointerEvents='none';
  },600);

  // Show interior + play sound
  setTimeout(()=>{
    playOpenSound();
    document.getElementById('box-int').classList.add('show');
    buildInterior();
    document.getElementById('read-pile').style.display='block';
  },850);
});

// ── Click envelope ──
function clickEnv(i,el){
  const rect=el.getBoundingClientRect();
  const fly=document.getElementById('fly-env');
  const sealSz=rect.width*0.224;
  const seal=fly.querySelector('.fly-seal');
  seal.style.cssText=`width:${sealSz}px;height:${sealSz}px;font-size:${sealSz*.38}px;`;

  fly.style.cssText=`left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;height:${rect.height}px;opacity:1;transition:none;border-radius:2px;`;

  // Animate fly to screen center
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    fly.style.transition='all .44s cubic-bezier(.25,.46,.45,.94)';
    fly.style.left=(innerWidth/2-rect.width/2)+'px';
    fly.style.top=(innerHeight/2-rect.height/2)+'px';
    fly.style.transform='scale(1.5)';
    fly.style.opacity='0';
  }));

  // Fade out mini env
  setTimeout(()=>{el.style.opacity='0';el.style.transform=`scale(0.5)`;},50);
  setTimeout(()=>el.remove(),320);

  // Reset fly
  setTimeout(()=>{fly.style.cssText='opacity:0;';},520);

  // Open modal
  setTimeout(()=>{pendingClose=i;openModal(i);},420);
}

// ── Modal ──
function renderModal(i){
  const[src,msg]=DATA[i];
  document.getElementById('m-img').src=src;
  document.getElementById('m-msg').textContent=msg;
  document.getElementById('m-lnum').textContent=`Lá thư số ${String(i+1).padStart(2,'0')}`;
  document.getElementById('nav-ctr').textContent=`${i+1} / ${DATA.length}`;
}
function openModal(i){
  current=i;renderModal(i);
  if(!openedSet.has(i))openedSet.add(i);
  document.getElementById('modal').classList.add('active');
  document.body.style.overflow='hidden';
}
function closeModal(){
  document.getElementById('modal').classList.remove('active');
  document.body.style.overflow='';
  setTimeout(()=>{
    if(pendingClose>=0){addToPile(pendingClose);pendingClose=-1;}
    updateCounter();
  },360);
}
document.getElementById('m-close').addEventListener('click',closeModal);
document.getElementById('m-bg').addEventListener('click',closeModal);

function navigateModal(dir){
  let ni=(current+dir+DATA.length)%DATA.length;
  // Prefer unread
  for(let k=1;k<=DATA.length;k++){
    const idx=(current+dir*k+DATA.length)%DATA.length;
    if(!openedSet.has(idx)){ni=idx;break;}
  }
  if(pendingClose>=0){addToPile(pendingClose);updateCounter();}
  const el=document.getElementById(`me${ni}`);
  if(el){el.style.opacity='0';el.style.transform='scale(0.5)';setTimeout(()=>el.remove(),280);}
  pendingClose=ni;
  if(!openedSet.has(ni))openedSet.add(ni);
  current=ni;renderModal(ni);
}
document.getElementById('nav-prev').addEventListener('click',()=>navigateModal(-1));
document.getElementById('nav-next').addEventListener('click',()=>navigateModal(1));
document.addEventListener('keydown',e=>{
  if(!document.getElementById('modal').classList.contains('active'))return;
  if(e.key==='Escape')closeModal();
  if(e.key==='ArrowLeft')navigateModal(-1);
  if(e.key==='ArrowRight')navigateModal(1);
});

// ── Read pile ──
function addToPile(i){
  pileCount++;
  const stack=document.getElementById('pile-stack');
  const card=document.createElement('div');card.className='pc';
  const rot=(pileCount%2===0?1:-1)*(1.5+(pileCount*2.1)%8);
  const ox=(pileCount%3-1)*5;
  const oy=-Math.min(pileCount*2,50);
  card.style.transform=`rotate(${rot}deg) translate(${ox}px,${oy}px)`;
  card.style.zIndex=pileCount;
  stack.appendChild(card);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{card.style.opacity='1';}));
  document.getElementById('pile-lbl').textContent=`Đã đọc: ${pileCount} / 34`;
}
function updateCounter(){
  const rem=DATA.length-openedSet.size;
  document.getElementById('box-counter').textContent=rem>0?`${rem} lá thư chưa đọc`:'Tất cả đã được đọc ♥';
}
</script>
